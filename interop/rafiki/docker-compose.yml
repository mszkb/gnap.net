# Rafiki's GNAP authorization server (Interledger / Open Payments) for
# Gnap.Interop.Tests.Rafiki. The .NET tests run on the host: they serve the
# client's wallet address + JWKS on port 5199 (reached from the container via
# host.docker.internal) and act as the user's browser and the tenant's identity
# provider. Start with interop/run-rafiki.sh.
name: gnap-interop-rafiki

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_development
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine

  auth:
    image: ${RAFIKI_AUTH_IMAGE:-ghcr.io/interledger/rafiki-auth:v2.4.1-beta}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3006:3006" # GNAP grant / continuation / token management / interaction front channel
      - "3007:3007" # token introspection
      - "3009:3009" # IdP interaction API (accept / reject)
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      AUTH_DATABASE_URL: postgresql://postgres:password@postgres:5432/auth_development
      # The public origin the client uses; it also enters the interaction finish hash.
      AUTH_SERVER_URL: http://localhost:3006
      REDIS_URL: redis://redis:6379/1
      # Only used to redirect the "browser"; the test reads interactId/nonce from it.
      IDENTITY_SERVER_URL: http://localhost:5199/idp/
      IDENTITY_SERVER_SECRET: interop-idp-secret
      COOKIE_KEY: 42397d1f371dd4b8b7d0308a689a57c882effd4ea909d792302542af47e2cd37
      ADMIN_API_SECRET: iyIgCprjb9uL8wFckR+pLEkJWMB7FJhgkvqhTQR/964=
      OPERATOR_TENANT_ID: 438fa74a-fa7d-4317-9ced-dde32ece1787
      SERVICE_API_PORT: 3011
