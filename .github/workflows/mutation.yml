name: Mutation testing

on:
  workflow_dispatch:
  # Gate on pull requests that touch the mutation-tested crypto code
  # (scopes: stryker-config.json, stryker-config.keyproofing.json).
  pull_request:
    paths:
      - 'src/Gnap.HttpMessageSignatures/**'
      - 'src/Gnap.Core/Proofing/**'
      - 'tests/Gnap.HttpMessageSignatures.Tests/**'
      - 'tests/Gnap.Core.Tests/**'
      - 'stryker-config*.json'
      - '.config/dotnet-tools.json'
  schedule:
    - cron: '17 3 * * *' # nightly

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker.NET ${{ matrix.scope }} (break at 90 %)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: signatures
            config: stryker-config.json
          - scope: key-proofing
            config: stryker-config.keyproofing.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Stryker.NET
        run: dotnet stryker --config-file ${{ matrix.config }} --break-at 90 --output StrykerOutput/ci

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.scope }}
          path: StrykerOutput/ci/reports
          retention-days: 14
